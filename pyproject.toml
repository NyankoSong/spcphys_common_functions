[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spcphys-common-functions"
version = "0.1.0"
description = "A collection of commonly used functions for space physics research, including Alfvénic parameter calculations, plasma analysis, and data processing tools."
readme = "Readme.md"
license = {text = "MIT"}
authors = [
    {name = "NyankoSong", email = "nyankosong@gmail.com"},
    {name = "Shuyi Meng"}
]
maintainers = [
    {name = "NyankoSong", email = "nyankosong@gmail.com"}
]
keywords = [
    "space physics",
    "solar wind",
    "plasma physics",
    "alfven waves",
    "magnetohydrodynamics",
    "heliophysics",
    "CDF",
    "Parker Solar Probe",
    "Solar Orbiter",
    "magnetic field",
    "velocity distribution function",
    "backmapping"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed"
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.8",
    "astropy>=7.1.0",
    "beartype>=0.21.0",
    "cdasws>=1.8.11",
    "cdflib>=1.3.4",
    "matplotlib>=3.10.3",
    "nest_asyncio>=1.6.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "scipy>=1.15.3",
    "sunpy>=6.1.1",
    "tqdm>=4.67.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.urls]
Homepage = "https://github.com/NyankoSong/spcphys-common-functions"
Documentation = "https://github.com/NyankoSong/spcphys-common-functions#readme"
Repository = "https://github.com/NyankoSong/spcphys-common-functions.git"
Issues = "https://github.com/NyankoSong/spcphys-common-functions/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["spcphys_common_functions"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=spcphys_common_functions --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/spcphys_common_functions"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
